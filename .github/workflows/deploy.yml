# Builds and deploys platte.dev on every push to main, so posts synced from
# poo-tee-weet go live without a manual `wrangler deploy`.
#
# Needs one repo secret: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit). Until
# it exists the deploy steps are skipped and the run stays green.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.token.outputs.present == 'true'

      - run: npm run build
        if: steps.token.outputs.present == 'true'

      - uses: cloudflare/wrangler-action@v3
        if: steps.token.outputs.present == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6f9565cb51f0bb050c420ca18dfff22f
          command: deploy
